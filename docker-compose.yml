# BiteStream — full local stack
#   docker compose up -d postgres mongo     # databases (schema + indexes created on first start)
#   docker compose run --rm seed            # load seed data (run once)
#   docker compose up -d api web            # once api/ and web/ exist
#
# Wipe everything and start over:  docker compose down -v

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bitestream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files run in alphabetical order on first start only (empty volume).
      - ./sql/01_schema_ddl.sql:/docker-entrypoint-initdb.d/01_schema_ddl.sql:ro
      - ./sql/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./sql/03_triggers_and_audit.sql:/docker-entrypoint-initdb.d/03_triggers_and_audit.sql:ro
      - ./sql/04_stored_procedures.sql:/docker-entrypoint-initdb.d/04_stored_procedures.sql:ro
      - ./sql/05_materialized_views.sql:/docker-entrypoint-initdb.d/05_materialized_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitestream"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./mongo/01_collections_and_indexes.js:/docker-entrypoint-initdb.d/01_collections_and_indexes.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  seed:
    image: python:3.12-slim
    working_dir: /app/data_generation
    volumes:
      - ./data_generation:/app/data_generation:ro
    environment:
      DB_NAME: bitestream
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      MONGO_URI: mongodb://mongo:27017/
    command: >
      sh -c "pip install -q -r requirements.txt &&
             python postgres_seeder.py &&
             python mongo_seeder.py"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    profiles: ["seed"]

  # api:   (Node/Express, added in api/)
  # web:   (React/Vite, added in web/)

volumes:
  pgdata:
  mongodata:
